# A worked OpenLiteSpeed / LiteSpeed configuration for the Whisper edge policy module.
#
# THE INTEGRATION IS ONE BLOCK, marked 1. Everything else is an ordinary server config, kept because a
# worked example that omits the boring parts is one people cannot copy.
#
# The default mode is `log`: every rule that would deny writes a line into your error log instead,
# exposes its decision as WHISPER_EDGE_* environment values for your access log, and blocks nothing.
# Run it that way against your own traffic for a week, read what the policy says about your real
# visitors, and turn on `deny` yourself. We would rather you never enable it than enable it on our word
# and lose a customer.
#
# FIRST, BUILD AND INSTALL THE MODULE. LiteSpeed is not Apache-module-compatible (it reads Apache
# DIRECTIVES, which is a different thing), so this is its own LSIAPI module:
#
#     ./litespeed/build.sh            # fetches the PINNED LSIAPI header (tag and digest) and compiles
#     sudo ./litespeed/build.sh --install
#
# WHAT GRANULARITY YOU GET, stated plainly because it differs from the other two servers. On
# OpenLiteSpeed a module's configuration is honoured at the SERVER and VIRTUAL HOST levels. A
# per-context block is read by the config parser and never reaches a module, so there is no
# per-location control here; the nginx and Apache modules do have it. Per-virtual-host is the useful
# unit on a web host anyway: it is one site. OpenLiteSpeed judges a request under the virtual host's
# one policy each time its request processing passes its access hook; an internal rewrite or an index
# file may pass it more than once, the decision is the same whichever context a pass selects, and the
# per-rule counters count each pass.

# ---- 1. THE INTEGRATION -----------------------------------------------------------------------------
#
# In httpd_config.conf, at the top level. One data source and one floor for the whole server.
#
# The data source here is the per-plane directory, the form the block `install.sh` writes (it adds the
# summary line too, and starts in log mode until --arm-deny). `whisper_edge_data <directory>` reads one file
# per plane (reputation.bin, tor.bin, and the others), each root-owned, mode 0444 and replaced by rename,
# and gives every attribute of the language; the module refuses a plane that is not, because whoever can
# write a plane decides whom your server blocks. The installer keeps each plane fresh with its own timer
# (`whisper-edge-refresh@<plane>.timer`), hourly for reputation. A rule on a plane the directory does not hold
# yet is inert and says so at load, and the signed manifest may withhold a plane, so `tor_exit` and
# `rpki_unreachable` below are commented until you have read what your directory holds.
#
# The single-file form, `whisper_edge_snapshot <file>`, binds snapshot.bin, which carries the reputation
# plane alone; the installer no longer fetches it.
module mod_whisper_edge {
    ls_enabled                   1
    whisper_edge_data            /var/lib/whisper-edge
    whisper_edge_summary         /var/lib/whisper-edge/counters
    # whisper_edge_snapshot      /var/lib/whisper-edge/snapshot.bin   # the single-file form, in place of the data line

    # The floor: rules every site is judged by, which no virtual host can change (it takes deny and log
    # rules only, so a later line can only tighten). Evaluated under THIS level's mode and deny status.
    whisper_edge_policy_floor    deny if listed >= critical
    # whisper_edge_policy_floor  log if tor_exit           # reads the tor plane, once tor.bin is there

    # The server's own policy, inherited by every site that writes no policy lines of its own. A site
    # that writes any policy line REPLACES these, never appends to them.
    whisper_edge_policy          deny if listed >= high
    # whisper_edge_policy        log if rpki_unreachable   # reads the rpki-unreachable plane, once its file is there

    # Behind a CDN or a load balancer: name the proxies you trust and the header they append. The header
    # is read only when the connection comes from a trusted proxy, walked right to left past trusted
    # entries, and the floor judges the first address that is not a proxy. A client cannot choose it.
    # Separate the proxies with spaces (a comma is part of an entry, which is then refused, as Apache and nginx
    # read it). A trust line the module refuses refuses the whole configuration: the module runs no program,
    # serves every request and says why in the error log, until the line is fixed.
    # whisper_edge_trusted_proxy   10.0.0.0/8 2001:db8::/32
    # whisper_edge_trusted_header  X-Forwarded-For

    # How often the module checks for a new plane generation; the default is 60 s. Clamped to [10, 86400].
    whisper_edge_refresh         60
    # whisper_edge_mode          deny
}

# ---- Reading what it thinks, which is the whole of log mode -----------------------------------------
#
# In the VIRTUAL HOST config (vhconf.conf). Note `useServer 0` and the $SERVER_ROOT-relative path:
# without both, OpenLiteSpeed accepts the block and writes no file at all.
#
#   accessLog $SERVER_ROOT/logs/$VH_NAME.access.log {
#       useServer            0
#       logFormat            "%h %l %u %t \"%r\" %>s %O whisper=%{WHISPER_EDGE_ACTION}e by %{WHISPER_EDGE_RULE_ID}e %{WHISPER_EDGE_VERDICT}e %{WHISPER_EDGE_GENERATIONS}e"
#   }
#
# Every judged request carries WHISPER_EDGE_ACTION (allow, would-deny, deny), _RULE and _RULE_ID (the
# deciding rule's text and id), _REASON, _PROGRAM (the floor's and the context's program digests),
# _LOGGED, _GENERATIONS (which plane generation and data set each attribute came from), _FLOOR_ADDR (the
# judged address) and _VERDICT (the reputation level), plus one WHISPER_EDGE_<ATTRIBUTE> per attribute of
# the planes this site's rules read; `whisper_edge_export <names>` or `whisper_edge_export all` adds more.
# OpenLiteSpeed's own rewrite `[E=...]` can overwrite an environment value; the error log and the
# per-rule counters (whisper-edge-summary --rules) are the records it cannot.

# ---- Turning it on, when YOU have decided to --------------------------------------------------------
#
# Server-wide, in the block above:
#
#   whisper_edge_mode        deny
#
# Or per site, which is the better way to start. In that site's vhconf.conf:
#
#   module mod_whisper_edge {
#       ls_enabled           1
#       whisper_edge_mode    deny
#       whisper_edge_policy  deny if listed >= high
#       whisper_edge_policy  deny if country in @embargo and rpki != valid
#       # (country and rpki read the per-plane form: inert under the snapshot alone)
#       whisper_edge_set     @embargo KP SY CU
#       whisper_edge_deny_status 451
#   }
#
# A site with `whisper_edge_mode off` skips its own rules; the floor still judges every request, under
# the server level's mode. A policy line the compiler refuses refuses that site's policy as a whole (it
# runs no rule of its own and the error log says which line and why); the floor and every other site
# stand. LiteSpeed has no configuration test, so read the error log after a change.

# ---- The old directives still work ------------------------------------------------------------------
#
# `whisper_edge_snapshot /var/lib/whisper-edge/snapshot.bin` reads the single reputation file as before. Beside a
# whisper_edge_data directory it is the reputation plane's file, in place of the directory's reputation.bin, and
# a per-plane `whisper_edge_data reputation` line beside it is refused, naming both. `whisper_edge_threshold high`
# in a site with no policy lines is exactly the rule `deny if listed >= high`. The two forms compile to one
# program, byte for byte, and the configuration-time line prints both digests.
#
#   whisper_edge_threshold   high
#   whisper_edge_allow_inferred  off

# ---- Behind a proxy or CDN --------------------------------------------------------------------------
#
# The module judges the address the server reports; it trusts only an explicit `useIpInProxyHeader 0`.
# Prefer whisper_edge_trusted_proxy and whisper_edge_trusted_header above, which the module reads itself
# and no site can change, and write this at the top level of httpd_config.conf:
#
#   useIpInProxyHeader       0
#
# The module trusts only an explicit 0. Any other setting, or none, and the module says so at ERROR in the
# error log and marks its status (whisper-edge-summary --status exits 1 with client-ip-from-header).
#
# A listener bound to a unix socket (address uds:/path/to.sock, which this server does bind) has a peer
# with no address at all. Name `unix:` in whisper_edge_trusted_proxy and the walk reads the address your
# proxy appended. With whisper_edge_trusted_header set and no unix: entry the header line is refused at
# startup, because such a listener forwards every request and not one of them would ever be judged past
# the peer itself; the error log names both settings and the fix.
