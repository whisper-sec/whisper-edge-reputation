<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#ebe3ff"/>

  <text x="44" y="58" font-size="26" font-weight="800" fill="rgb(22,22,29)">Whisper <tspan fill="#7c3aed">edge</tspan></text>

  <!-- fence with an open gate -->
  <g fill="#5b21b6">
    <rect x="440" y="88" width="12" height="80" rx="4"/><rect x="470" y="80" width="12" height="88" rx="4"/><rect x="500" y="88" width="12" height="80" rx="4"/>
    <rect x="440" y="250" width="12" height="80" rx="4"/><rect x="470" y="242" width="12" height="88" rx="4"/><rect x="500" y="250" width="12" height="80" rx="4"/>
  </g>
  <g fill="#7c3aed">
    <rect x="430" y="110" width="92" height="9" rx="4"/><rect x="430" y="142" width="92" height="9" rx="4"/>
    <rect x="430" y="272" width="92" height="9" rx="4"/><rect x="430" y="304" width="92" height="9" rx="4"/>
  </g>

  <!-- everyone else walks through the gate -->
  <path d="M60 209 H770" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
  <g fill="#c4b5fd"><circle cx="80" cy="209" r="10"/><circle cx="190" cy="209" r="10"/><circle cx="600" cy="209" r="10"/><circle cx="700" cy="209" r="10"/></g>

  <!-- stopped at the fence, each with the fact that stopped it -->
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="700">
    <path d="M300 126 H422" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
    <circle cx="300" cy="126" r="12" fill="#7c3aed"/>
    <rect x="148" y="111" width="136" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="216" y="131" fill="#5b21b6" text-anchor="middle">listed: high</text>

    <path d="M330 290 H422" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
    <circle cx="330" cy="290" r="12" fill="#7c3aed"/>
    <rect x="164" y="275" width="150" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="239" y="295" fill="#5b21b6" text-anchor="middle">rpki: invalid</text>
    <circle cx="372" cy="250" r="12" fill="#7c3aed"/>
    <path d="M384 250 H432" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="290" y="231" width="64" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="322" y="251" fill="#5b21b6" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="700">c2</text>

  <!-- your rules -->
  <g transform="translate(790,72)">
    <rect width="366" height="236" rx="16" fill="#ffffff" stroke="#ebe3ff" stroke-width="2"/>
    <text x="24" y="38" font-size="13" font-weight="700" fill="#7c3aed" letter-spacing="1.5">YOUR RULES</text>
    <circle cx="342" cy="33" r="6" fill="#22c55e"/>
    <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" fill="rgb(22,22,29)">
      <text x="24" y="74"><tspan fill="#7c3aed" font-weight="700">allow</tspan> if asn in @partners</text>
      <text x="24" y="100"><tspan fill="#7c3aed" font-weight="700">deny </tspan> if listed &gt;= high</text>
      <text x="24" y="126"><tspan fill="#7c3aed" font-weight="700">deny </tspan> if rpki == invalid</text>
      <text x="24" y="152"><tspan fill="#7c3aed" font-weight="700">deny </tspan> if c2 or phishing</text>
      <text x="24" y="178"><tspan fill="#7c3aed" font-weight="700">log  </tspan> if tor_exit</text>
    </g>
    <text x="24" y="214" font-size="15" font-weight="600" fill="#5b21b6">Every block shows its receipt.</text>
  </g>
</svg>
