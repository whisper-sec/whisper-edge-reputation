# A worked Apache httpd configuration for the Whisper edge policy module.
#
# THE INTEGRATION IS TWO LINES, marked 1/2. Everything else is an ordinary httpd config, kept because
# a worked example that omits the boring parts is one people cannot copy.
#
# The default mode is `log`: every context runs `deny if listed >= high` as a dry run, writes the verdict
# it WOULD have acted on into your error log, exposes the decision as request notes for your access log,
# and blocks nothing. Run it that way against your own traffic for a week, read what we say about your
# real visitors, and turn on `deny` yourself. We would rather you never enable it than enable it on our
# word and lose a customer.
#
# WORKS UNDER EVERY MPM: prefork, worker and event, all three proven by apache-gate.sh on every change.
# The module keeps one thread per child for its own file work (verifying a new plane, writing its status
# and counter files); no request ever reads, hashes or stats a file.

# 1
LoadModule whisper_edge_module modules/mod_whisper_edge.so

# 2 - where the data lives (httpd reads a trailing `# comment` as an argument, so the two markers sit
# on lines of their own).
#
# This binds snapshot.bin, the single file that carries the reputation plane, fetched as root and
# replaced by rename (nginx/example.conf shows the three lines). The module
# reads the file into its own memory and refuses one that is group- or world-writable, and every
# directory above it must be owned by root (or the configuration's own user) and writable by neither
# group nor world: whoever can write this path decides whom your site blocks.
WhisperEdgeSnapshot /var/lib/whisper-edge/snapshot.bin

# The installer binds a directory of <plane>.bin files instead, and keeps each plane there fresh on its
# own timer (`whisper-edge-refresh@<plane>.timer`); a key adds the keyed planes to the same directory. Name
# the directory instead of the snapshot:
#
#   WhisperEdgeData /var/lib/whisper-edge
#
# A rule on a plane that is not installed is reported at configuration test and is inert: it never denies.

# How often each child's thread looks at the files. The default is 60 s and there is no reason to lower
# it: the feed is rebuilt hourly at most, and the floor is 10 s.
# WhisperEdgeRefresh 60

# ---- Reading what it thinks, which is the whole of log mode ----------------------------------------
#
# Every judged request carries the decision as request NOTES, so they go in your access log like
# anything else. Read them with %{...}n: the notes are the one surface no SetEnv or RewriteRule [E=] can
# overwrite. WHISPER_EDGE_ACTION is allow, deny or would-deny; WHISPER_EDGE_RULE_ID names the deciding
# rule (ctx:4, floor:1, or - for none); WHISPER_EDGE_VERDICT is the reputation severity of the client
# (none, low ... critical, with ,spamhaus-drop and ,inferred where they apply; unknown, unknown,stale or
# unknown,disarmed when the plane cannot be read); WHISPER_EDGE_GENERATIONS names the plane generation
# and digest that backed the decision, so a line can be traced to a feed.
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" whisper=%{WHISPER_EDGE_ACTION}n/%{WHISPER_EDGE_RULE_ID}n/%{WHISPER_EDGE_VERDICT}n gen=\"%{WHISPER_EDGE_GENERATIONS}n\"" whisper
CustomLog /var/log/apache2/access.log whisper

# ---- Turning it on, when YOU have decided to -------------------------------------------------------
#
# Uncomment ONE of these. Server-wide:
#
#   WhisperEdgeMode deny
#
# Or only where you want it, which is the better way to start. WhisperEdgeMode works in the main
# configuration, <VirtualHost>, <Directory>, <DirectoryMatch>, <Location> and <LocationMatch>, and the
# nearest enclosing one wins:
#
#   <Location "/wp-login.php">
#       WhisperEdgeMode deny
#   </Location>
#
# And exempt anything that must never be judged by its context's rules, such as a health check your load
# balancer calls (the http-level floor, below, still runs there):
#
#   <Location "/healthz">
#       WhisperEdgeMode off
#   </Location>
#
# It is deliberately NOT settable from .htaccess, nor in <Files>, <If>, <Limit> or <Proxy>: a policy is
# selected by path, and on shared hosting a tenant could otherwise switch blocking on for a neighbour's
# traffic, or off for their own.

# ---- Writing your own rules ------------------------------------------------------------------------
#
# WhisperEdgeThreshold is sugar: `WhisperEdgeThreshold high` IS the rule `deny if listed >= high`, and the
# two compile to the same program byte for byte. The rule language is ordered, first match wins, default
# allow; a context's lines REPLACE its parent's. The snake_case spellings (whisper_edge_policy ...) are
# the same directives, so one policy text reads the same under nginx, Apache and LiteSpeed.
#
#   <VirtualHost *:80>
#       ServerName shop.example.com
#       WhisperEdgeMode deny
#       WhisperEdgePolicy deny  if listed >= critical
#       WhisperEdgePolicy deny  if listed >= high
#       WhisperEdgePolicy log   if tor_exit
#       WhisperEdgePolicy allow if asn in @partners
#       WhisperEdgePolicy deny  if country in @embargo and rpki != valid
#       WhisperEdgeSet    @embargo  KP SY CU
#       WhisperEdgeSet    @partners AS64496 AS64497
#       # the status a deny sends in this host; 403 by default
#       WhisperEdgeDenyStatus 429
#   </VirtualHost>
#
# A rule with an error fails `apachectl configtest`, with the file, the line, the column and a fix, so
# nothing partial ever loads.

# ---- The floor: what no virtual host can turn off ------------------------------------------------
#
# One deny or log rule at the http level, run before every context's rules under the http level's own
# mode and deny status, so a tenant's `WhisperEdgeMode off` in a <VirtualHost> cannot disarm it. It
# needs `WhisperEdgeMode deny` HERE to deny; with the default log it is a dry run, and the configuration
# test says so.
#
#   WhisperEdgeMode deny
#   WhisperEdgePolicyFloor deny if listed >= critical

# ---- Behind a proxy, a load balancer or a CDN ------------------------------------------------------
#
# The floor judges the TCP peer: it never reads mod_remoteip's result, because a virtual host can redefine
# that. To judge your clients behind a proxy you trust, name the proxy and the header it appends to, and
# with a CDN name the hop to take rather than trusting a shared range:
#
#   WhisperEdgeTrustedProxy  203.0.113.0/24
#   WhisperEdgeTrustedHeader X-Forwarded-For
#   # the entry the proxy itself appended; 2 behind a CDN that appends after it
#   WhisperEdgeTrustedHops   1
#
# The context's rules judge r->useragent_addr, so give mod_remoteip the same proxies:
#
#   LoadModule remoteip_module modules/mod_remoteip.so
#   RemoteIPHeader X-Forwarded-For
#   RemoteIPInternalProxy 203.0.113.0/24
#
# An address the floor reached past a hop never gets the fixed exemptions (loopback, private ranges and
# the like), because a shared trusted range lets anyone in it choose the next entry.

# ---- Where the counters and the status go ----------------------------------------------------------
#
# Each child's thread writes <pid>-<id>.status, <pid>-<id>.rules.cnt and <pid>-<id>.cnt into one
# directory, plus conf-<digest>.status once per configuration; `whisper-edge-summary --rules <dir>` sums
# the per-rule counts of every writer, live or gone, and `--status <dir>` says whether every plane is
# armed (exit 0) or not (exit 1). The directory defaults to a `counters` directory beside the data.
# WhisperEdgeSummary /var/lib/whisper-edge/counters

# ---- Ordinary httpd below this line ----------------------------------------------------------------
ServerName www.example.com
Listen 80
DocumentRoot /var/www/html
ErrorLog /var/log/apache2/error.log
LogLevel warn

<Directory /var/www/html>
    Require all granted
</Directory>
