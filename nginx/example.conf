# A worked nginx configuration for the Whisper edge reputation module.
#
# THE INTEGRATION IS THREE LINES, marked 1/2/3. Everything else is an ordinary nginx config, kept
# because a worked example that omits the boring parts is one people cannot copy.
#
# The default mode is `log`: it writes the verdict it WOULD have acted on into your error log, exposes
# it as $whisper_edge_verdict for your access log, and blocks nothing. Run it that way against your own
# traffic for a week, read what we say about your real visitors, and turn on `deny` yourself. We would
# rather you never enable it than enable it on our word and lose a customer.

load_module modules/ngx_http_whisper_edge_module.so;              # 1

worker_processes auto;
error_log  /var/log/nginx/error.log;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 2 - where the snapshot lives.
    #
    # The file MUST NOT be group- or world-writable: the loader refuses one that is. The digest in the
    # snapshot is an integrity check, not a signature, so whoever can write this file decides whom your
    # site blocks. Fetch it as root, write it with mode 0644, and replace it by RENAME:
    #
    #     curl -fsS -o /var/lib/whisper-edge/snapshot.new https://whisper.online/edge/snapshot.bin
    #     chmod 0644 /var/lib/whisper-edge/snapshot.new
    #     mv  /var/lib/whisper-edge/snapshot.new /var/lib/whisper-edge/snapshot.bin
    #
    # Rename, not `curl -o` straight onto the live path. A file rewritten in place is disarmed as soon
    # as the module notices, and a half-written file is refused, so either costs you the plane until the
    # next good file; a rename is atomic.
    whisper_edge_snapshot /var/lib/whisper-edge/snapshot.bin;      # 2

    # Or a directory of planes, one <plane>.bin each, with any one plane taken from a file of its own
    # (an absolute path, in a directory owned by root and closed to group and world). Beside either,
    # the snapshot above is the reputation plane's file.
    # whisper_edge_data /var/lib/whisper-edge;
    # whisper_edge_data tor /var/lib/whisper-edge-tor/tor.bin;

    # How often each worker re-checks the file. The default is 60s and there is no reason to lower it:
    # the feed is rebuilt hourly at most, and the floor is 1s.
    # whisper_edge_refresh 60s;

    # Put our opinion in your own access log, next to your real traffic. This is the point of log mode.
    log_format whisper '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'whisper=$whisper_edge_verdict';
    access_log /var/log/nginx/access.log whisper;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /var/www/html;

        # 3 - log, do not block. THIS IS THE DEFAULT and you do not need to write it; it is here so the
        # example says out loud what the module does if you change nothing.
        whisper_edge_mode log;                                    # 3

        # When you are ready, after reading your own logs for a week:
        #
        #   whisper_edge_mode deny;              # actually refuse the request, with a 403
        #   whisper_edge_threshold high;         # the default: block high and critical only
        #
        # Two knobs worth knowing about and one you should leave alone:
        #
        #   whisper_edge_threshold critical;     # stricter: only the strongest verdicts block
        #   whisper_edge_allow_inferred on;      # DO NOT. See below.
        #
        # `allow_inferred` enables entries we derived from graph structure rather than from a citable
        # listing. They are flagged in the snapshot precisely so the module refuses to act on them, and
        # we do not think you should turn it on. It exists so the inference tier can be distributed and
        # studied without being enforceable by accident.

        location / {
            try_files $uri $uri/ =404;
        }

        # A path you want exempt regardless - a payment callback, a health check, a partner's webhook.
        location = /webhook/partner {
            whisper_edge_mode off;
            proxy_pass http://127.0.0.1:8080;
        }
    }
}

# ---- A note on running behind a load balancer or CDN ----
#
# If nginx sees your balancer's address rather than the client's, the module will judge the balancer.
# Two parts of the decision read the client address, and each needs its own line.
#
# The floor and the hold-harmless list judge the TCP peer, captured before any module can rewrite it,
# and walk the forwarding header only from proxies you name to the module itself:
#
#     whisper_edge_trusted_proxy  203.0.113.0/24;   # ONLY your balancers' own addresses
#     whisper_edge_trusted_header X-Forwarded-For;
#     whisper_edge_trusted_hops   1;                # the entry your proxy appended
#
# The context's rules run last in the PREACCESS phase, so they judge the address nginx's realip module
# derived, when you configure it, for the same proxies:
#
#     set_real_ip_from 203.0.113.0/24;      # ONLY addresses you actually control
#     real_ip_header   X-Forwarded-For;
#
# Be precise about `set_real_ip_from`. It is a list of hosts you TRUST to tell you the client address.
# Trusting anything you do not control - and in particular trusting 127.0.0.1 or 0.0.0.0/0 - lets a
# client choose the address we judge, which both defeats the blocking and lets somebody else be framed
# into a 403 by a forged header. An earlier version of this example trusted 127.0.0.1 because that is
# what the test harness needed, which would have taught exactly the wrong thing to anyone who copied
# it. If you are not behind a proxy, do not configure realip at all.
